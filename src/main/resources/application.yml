spring:
  application:
    name: authentication
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/authentication_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:ADMIN}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

api:
  security:
    token:
      # DEV ONLY - NOT FOR PRODUCTION. Always set JWT_SECRET outside local development.
      secret: ${JWT_SECRET:dev-only-insecure-secret-change-me}
